events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams pointing to internal docker network services
    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:4000;
    }

    # HTTP Server (Port 80) - Redirects to HTTPS or serves health checks
    server {
        listen 80;
        server_name localhost;

        location /.well-known/health {
            proxy_pass http://api_upstream/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (Port 443) - Full TLS Proxy with Hardened Security Headers
    server {
        listen 443 ssl;
        server_name localhost;

        # TLS Certificates
        ssl_certificate     /etc/nginx/certs/sdms.crt;
        ssl_certificate_key /etc/nginx/certs/sdms.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:4000 https://localhost;" always;

        client_max_body_size 50M;

        # Web Frontend
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API backend
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Health endpoint
        location /health {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
